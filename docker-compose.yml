    mem_limit: 100m
    mem_reservation: 64m
    memswap_limit: 150m

  # -----------------------------
  # Tasks Service
  # -----------------------------
  tasks-service:
    image: tasks-service:latest
    container_name: tasks-service
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MALLOC_TRIM_THRESHOLD_=65536
      - PYTHONDONTWRITEBYTECODE=1
    logging: *default-logging
    restart: always
    mem_limit: 100m
    mem_reservation: 64m
    memswap_limit: 150m

  # -----------------------------
  # Projects Service
  # -----------------------------
  projects-service:
    image: projects-service:latest
    container_name: projects-service
    env_file:
      - .env

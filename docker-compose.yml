version: "3.8"

services:
  # -----------------------------
  # API Gateway
  # -----------------------------
  api-gateway:
    image: api-gateway:latest
    container_name: api-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - auth-service
      - organization-service
      - tasks-service
      - projects-service
      - email-service
    restart: always

  # -----------------------------
  # Auth Service
  # -----------------------------
  auth-service:
    image: auth-service:latest
    container_name: auth-service
    env_file:
      - .env
    restart: always

  # -----------------------------
  # Organization Service
  # -----------------------------
  organization-service:
    image: organization-service:latest
    container_name: organization-service
    env_file:
      - .env
    restart: always

  # -----------------------------
  # Tasks Service
  # -----------------------------
  tasks-service:
    image: tasks-service:latest
    container_name: tasks-service
    env_file:
      - .env
    restart: always

  # -----------------------------
  # Projects Service
  # -----------------------------
  projects-service:
    image: projects-service:latest
    container_name: projects-service
    env_file:
      - .env
    restart: always

  # -----------------------------
  # Email Service
  # -----------------------------
  email-service:
    image: email-service:latest
    container_name: email-service
    env_file:
      - .env
    restart: always

  # -----------------------------
  # New Relic Infrastructure Agent
  # -----------------------------
  newrelic-infra:
    image: newrelic/infrastructure:latest
    container_name: newrelic-infra
    privileged: true
    network_mode: host
    pid: host
    restart: unless-stopped
    environment:
      - NRIA_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NRIA_DISPLAY_NAME=taskuno-host
    volumes:
      - "/:/host:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"

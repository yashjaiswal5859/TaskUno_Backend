version: "3.8"

x-logging: &default-logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION}
    awslogs-group: ${CLOUDWATCH_LOG_GROUP}
    awslogs-create-group: "true"
    awslogs-stream-prefix: ${CLOUDWATCH_LOG_STREAM_PREFIX}

# ============================================================
# Memory Budget for 1GB (1024MB) EC2 Free Tier:
#   OS + Docker engine overhead:  ~300MB
#   6 services × 75MB hard limit: ~450MB
#   Headroom / buffer:            ~274MB
#   Total:                        ~1024MB
# ============================================================

services:
  # -----------------------------
  # API Gateway
  # -----------------------------
  api-gateway:
    image: api-gateway:latest
    container_name: api-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MALLOC_TRIM_THRESHOLD_=65536
      - PYTHONDONTWRITEBYTECODE=1
    logging: *default-logging
    depends_on:
      - auth-service
      - organization-service
      - tasks-service
      - projects-service
      - email-service
    restart: always
    mem_limit: 100m
    mem_reservation: 64m
    memswap_limit: 150m

  # -----------------------------
  # Auth Service
  # -----------------------------
  auth-service:
    image: auth-service:latest
    container_name: auth-service
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MALLOC_TRIM_THRESHOLD_=65536
      - PYTHONDONTWRITEBYTECODE=1
    logging: *default-logging
    restart: always
    mem_limit: 100m
    mem_reservation: 64m
    memswap_limit: 150m

  # -----------------------------
  # Organization Service
  # -----------------------------
  organization-service:
    image: organization-service:latest
    container_name: organization-service
